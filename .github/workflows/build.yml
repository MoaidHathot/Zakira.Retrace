name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        # The repo's NuGet.config maps packages to feeds only developer machines can reach; the
        # CI config points at nuget.org instead. --configfile makes NuGet use that file alone.
        run: dotnet restore Zakira.Retrace.slnx --configfile .github/nuget.ci.config

      - name: Build
        run: dotnet build Zakira.Retrace.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Zakira.Retrace.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Zakira.Retrace.slnx --configfile .github/nuget.ci.config

      - name: Pack
        run: dotnet pack Zakira.Retrace.slnx --configuration Release --no-restore --output artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.*nupkg
